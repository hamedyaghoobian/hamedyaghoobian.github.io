# How each Google Scholar paper is presented on the Publications page.
# Scholar supplies the facts (title, authors, venue, year, citations) into
# _data/scholar.json every week; this file is yours and is never touched by
# that job. Match papers by Scholar's id (shown in the weekly issue for new
# papers, or in _data/scholar.json).
#
#   category:  student | mine | collaboration   ("mine" shows as Sole-authored)
#   type:      a label for what it is, when not a paper: Poster, PhD dissertation…
#   students:  names as in _data/students.yml, shown with their class year
#   project:   a project page on this site
#   pdf:       a link to the paper, if Scholar's own link isn't the one you want
#   authors:   the author line to show, when Scholar's is incomplete or wrong
#   hidden:    true to leave a paper off the page (Scholar errors, duplicates)
#
# A Scholar paper with no entry here shows under "New, to sort".
# These first entries are a starting point — move anything that's misfiled.

