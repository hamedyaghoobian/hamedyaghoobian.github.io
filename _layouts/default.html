<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    <script>
      // Applies the theme before any content paints, so a system-dark
      // visitor (or anyone who has picked dark explicitly) never sees a
      // flash of the light theme first. Deliberately tiny and synchronous —
      // it only reads storage/media and sets a class + attribute, nothing
      // else. The full theme script (button wiring, cycling between modes,
      // live system-preference updates) lives in head.html and runs on
      // DOMContentLoaded instead, once #theme-pill actually exists.
      (function () {
        var stored = localStorage.getItem('theme');
        var mode = (stored === 'light' || stored === 'dark') ? stored : 'system';
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.body.classList.toggle('dark', dark);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- if page.url == "/" -%}
      {%- include footer.html -%}
    {%- else -%}
      {%- include footer-minimal.html -%}
    {%- endif -%}

  </body>

</html>
