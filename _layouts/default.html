<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}
  {%- include fp-section.html -%}

  <body class="fp fp-depth-{{ fp_depth }} fp-sec-{{ fp_key.n }}{% if page.body_class %} {{ page.body_class }}{% endif %}">
    <script>
      // First paint in the right theme: read the knob's last position before anything renders.
      (function () {
        var s; try { s = localStorage.getItem('theme'); } catch (e) {}
        var m = (s === 'light' || s === 'dark') ? s : 'system';
        var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.body.classList.toggle('dark', d);
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      })();
    </script>
    <a class="fp-skip" href="#content">skip to content</a>

    {%- include header.html -%}

    <main class="fp-main" id="content" aria-label="Content" tabindex="-1">
      {{ content }}
    </main>

    {%- include footer.html -%}
  </body>

</html>
