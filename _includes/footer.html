<footer class="site-footer">

  <!-- The mountains above Mashhad, drawn live by assets/js/mashhad-range.js
       in the site's ink, with Mashhad's own sun or moon at its true place
       for the hour there. Decorative: the caption below carries the time
       in words. -->
  <div class="footer-range" aria-hidden="true"></div>

  <div class="wrapper">
    <div class="footer-content">
      <!-- The short line is there from the start (and filled in with
           Mashhad's time by the script); the full line replaces it while
           the footer is awake. -->
      <p class="footer-place">
        <span class="footer-place__short">Mashhad, where I grew up</span>
        <span class="footer-place__full" aria-hidden="true"></span>
      </p>
      <p class="copyright-text">
        <span class="colophon-item">© {{ site.time | date: "%Y" }} Hamed Yaghoobian</span>
        <span class="footer-separator" aria-hidden="true">·</span>
        <span class="colophon-item built-with">built with <a href="https://jekyllrb.com">Jekyll</a></span>
      </p>
    </div>
  </div>

  <script src="{{ '/assets/js/mashhad-range.js' | relative_url }}" defer></script>

</footer>
